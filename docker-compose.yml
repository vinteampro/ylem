# Выкладка веб-версии на Mac Mini через self-hosted GitHub Actions runner (метка mac-mini).
# Traefik на этой машине уже слушает сеть services: вход websecure, сертификаты myresolver.
# Сайт: https://ylem.live  (нужна A-запись на Mac Mini).

name: ylem

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: ylem-web:latest
    container_name: ylem-web
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - services
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=services"
      - "traefik.http.routers.ylem.rule=Host(`ylem.live`) || Host(`www.ylem.live`)"
      - "traefik.http.routers.ylem.entrypoints=websecure"
      - "traefik.http.routers.ylem.tls.certresolver=myresolver"
      - "traefik.http.routers.ylem.service=ylem@docker"
      - "traefik.http.services.ylem.loadbalancer.server.port=80"
    logging:
      options:
        max-size: "5m"
        max-file: "3"

networks:
  services:
    external: true
