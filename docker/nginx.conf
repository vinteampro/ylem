# Веб-версия игры. HTTPS делает Traefik перед этим контейнером.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Сборка без потоков, поэтому заголовки COOP/COEP не нужны
    gzip on;
    gzip_types application/wasm application/javascript application/octet-stream text/css;
    gzip_min_length 1024;

    location / {
        # после обновления игры браузер сразу берёт новую версию
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
